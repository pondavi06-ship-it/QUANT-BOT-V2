name: Serverless Quant Trading Bot

on:
  workflow_dispatch:

concurrency:
  group: quant-bot-state-lock
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-quant-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --upgrade pip && pip install pandas numpy requests google-genai

      - name: Execute Audited Quant Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit Updated State Atomically
        run: |
          git config --global user.name "QuantBot State Manager"
          git config --global user.email "bot@github.com"
          touch trade_state.json trade_history.json
          git add trade_state.json trade_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: sync trade state [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Tidak ada perubahan state untuk disimpan."
          fi
